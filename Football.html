<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My favourite players</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class ="jumbotron jumbotron-fluid">
        <div class = "container">
            <h1>My Favourite Footballers</h1>
            <p class = "para">This webpage shows my favourite football players and how much I like them.</p>
        <button class = "btn btn-primary">Mbappe</button>
        <button class="btn btn-danger">Ronaldo</button>
        <button class="btn btn-success">Messi</button>
        <button class="btn btn-warning">Bellingham</button>
        </div>
    </div>
    <div class = "container">
        <h2>The GA of each player</h2>
        <p>Mbappe <span class = "badge badge-secondary">322</span></p>
        <p>Ronaldo <span class="badge badge-primary">1286</span></p>
        <p>Messi <span class="badge badge-dark">1344</span></p>
        <p>Bellingham <span class="badge badge-danger">236</span></p>
        <h2>How much I like them</h2>
        <p>Mbappe</p>
        <div class = "progress mb-3">
            <div class = "progress-bar bg-success" style="width:100%">
                100%
            </div>
        </div>
        <p>Ronaldo</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning" style="width:85%">
                85%
            </div>
        </div>
        <p>Messi</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger" style="width:70%">
                70%
            </div>
        </div>
        <p>Bellingham</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-info" style="width:90%">
                90%
            </div>
        </div>
    </div>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
