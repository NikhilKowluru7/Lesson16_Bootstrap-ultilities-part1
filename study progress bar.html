<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Study progess</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1>My Study Progress</h1>
            <p class="lead">These are my subjects, how many times I have them a week and how much I like them</p>
            <button class="btn btn-primary">Maths</button>
            <button class="btn btn-success">Science</button>
            <button class="btn btn-warning">English</button>
            <button class="btn btn-danger">History</button>
        </div>
    </div>

    <div class="container">
        <h2 class="section-title">Lessons in a week <span class="badge badge-danger">13</span></h2>
        <p>Math <span class="badge badge-primary">3 lessons</span></p>
        <p>Science <span class="badge badge-success">4 lessons</span></p>
        <p>English <span class="badge badge-warning">3 lessons</span></p>
        <p>History <span class="badge badge-info">3 lessons</span></p>
        <h2 class="section-title">How much I like it</h2>
        <p>Math</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary" style="width: 70%">70%</div>
        </div>
        <p>Science</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width: 15%">15%</div>
        </div>
        <p>English</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning" style="width: 90%">90%</div>
        </div>
        <p>History</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger" style="width: 95%">95%</div>
        </div>

    </div>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>

</html>
